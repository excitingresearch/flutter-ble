name: moody
description: Demonstrates how to use the flutter_reactive_ble plugin.
version: 5.0.3
publish_to: "none"

environment:
  sdk: ">=2.12.0 <3.0.0"
  flutter: ">=1.10.0"

dependencies:
  cron: ^0.5.1
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.32.8
  flutter_lints: ^1.0.4
  flutter_nfc_kit: ^3.3.1
  flutter_reactive_ble: ^5.0.3
  functional_data: ^1.0.0
  http: ^0.13.6
  intl: ^0.17.0

  keep_screen_on: ^4.0.0
  location: ^5.0.2+1
  permission_handler: ^11.4.0
  provider: ^6.1.2
  sensors_plus: ^3.0.3
  shared_preferences: ^2.2.3

dev_dependencies:
  build_runner: ^2.1.4
  dependency_validator: ^3.1.0
  flutter_test:
    sdk: flutter
  functional_data_generator: ^1.1.2

# dependency_overrides:
#   flutter_reactive_ble:
#     path: ../packages/flutter_reactive_ble
#   reactive_ble_mobile:
#     path: ../packages/reactive_ble_mobile

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icon/
